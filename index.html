<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MEIKO</title>
  <meta name="description" content="MEIKO: maritime navigation and everyday utility tools. Great circle and rhumb line distance, ETA, coordinates, merpass, sunrise, Maghrib, Qibla and GPS. Works offline.">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MEIKO">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { var t = JSON.parse(localStorage.getItem('meiko:v1:settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <!-- Icon sprite: 24×24 stroke icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="logo" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="31" fill="#0B1F3A"/>
        <circle cx="32" cy="32" r="25.5" fill="none" stroke="#C9A227" stroke-width="1.4"/>
        <g stroke="#C9A227" stroke-width="1.4" stroke-linecap="round">
          <path d="M32 3.5v4M32 56.5v4M3.5 32h4M56.5 32h4"/>
          <path d="M51.9 12.1l-2.1 2.1M12.1 51.9l2.1-2.1M12.1 12.1l2.1 2.1M51.9 51.9l-2.1-2.1" opacity=".6"/>
        </g>
        <path d="M32 10 37 32H27Z" fill="#E1C25A"/>
        <path d="M32 54 27 32h10Z" fill="#E8EEF6"/>
        <path d="M10 32 32 28.5v7Z" fill="#9FB0C8"/>
        <path d="M54 32 32 35.5v-7Z" fill="#9FB0C8"/>
        <circle cx="32" cy="32" r="2.6" fill="#0B1F3A" stroke="#C9A227" stroke-width="1.4"/>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></symbol>
      <symbol id="i-nav" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5h6a3.5 3.5 0 0 0 0-7h-3a3.5 3.5 0 0 1 0-7h6"/></symbol>
      <symbol id="i-anchor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v14"/><path d="M8 11h8"/><path d="M4 14a8 8 0 0 0 16 0"/></symbol>
      <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></symbol>
      <symbol id="i-course" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="m12 12 4-6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0"/><path d="m12 13 4-5"/><circle cx="12" cy="13" r="1.2"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/></symbol>
      <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7h8"/><path d="M8.5 11h0M12 11h0M15.5 11h0M8.5 14.5h0M12 14.5h0M15.5 14.5h0M8.5 18h0M12 18h0M15.5 18h0" stroke-width="2.4"/></symbol>
      <symbol id="i-convert" viewBox="0 0 24 24"><path d="M4 8h14l-3.5-3.5"/><path d="M20 16H6l3.5 3.5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M3 18h18M7 21h10"/><path d="M6.5 18a5.5 5.5 0 0 1 11 0"/><path d="M12 3v4M5.6 8.6l1.4 1.4M18.4 8.6 17 10"/></symbol>
      <symbol id="i-noon" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 20a8 8 0 0 1 16 0" stroke-dasharray="2 2.2"/><circle cx="12" cy="9" r="2.6"/><path d="M12 12v8"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-kaaba" viewBox="0 0 24 24"><path d="M12 3 3 7v10l9 4 9-4V7z"/><path d="m3 7 9 4 9-4M12 11v10"/><path d="m3 10 9 4 9-4" opacity=".6"/></symbol>
      <symbol id="i-gps" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4v16l-3-3M17 20V4l3 3"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h0"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h0"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M19 19v2H6"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m3 3 18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.1-1.6M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5"/><path d="M12 20h0"/></symbol>
      <symbol id="i-compass-rose" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width=".6"/>
        <path d="M50 4v10M50 86v10M4 50h10M86 50h10" stroke="currentColor" stroke-width="1"/>
        <path d="M50 14 55 50 50 86 45 50Z M14 50 50 45 86 50 50 55Z" fill="none" stroke="currentColor" stroke-width="1"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>

    <div class="content">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Back" hidden><svg class="i"><use href="#i-back"/></svg></button>
        <a class="brand brand-mini" href="#/" id="brandMini" aria-label="MEIKO home"><svg class="logo"><use href="#logo"/></svg></a>
        <div class="title" id="pageTitle">MEIKO</div>
        <span class="offline-pill"><svg class="i" style="width:14px;height:14px"><use href="#i-wifi-off"/></svg>Offline</span>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">MEIKO needs JavaScript enabled.</p></noscript>

  <!-- Core calculation modules (pure, tested in tests/run-tests.js) -->
  <script src="js/core/geo.js"></script>
  <script src="js/core/coords.js"></script>
  <script src="js/core/units.js"></script>
  <script src="js/core/navcalc.js"></script>
  <script src="js/core/solar.js"></script>
  <script src="js/core/prayer.js"></script>
  <script src="js/core/qibla.js"></script>
  <script src="js/core/calc.js"></script>
  <script src="js/core/nmea.js"></script>
  <script src="js/data/ports-data.js"></script>
  <!-- App infrastructure -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/features.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/gps.js"></script>
  <!-- Feature modules -->
  <script src="js/modules/navigation.js"></script>
  <script src="js/modules/calculator.js"></script>
  <script src="js/modules/converter.js"></script>
  <script src="js/modules/astronomy.js"></script>
  <script src="js/modules/prayer.js"></script>
  <script src="js/modules/qibla.js"></script>
  <script src="js/modules/position.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
